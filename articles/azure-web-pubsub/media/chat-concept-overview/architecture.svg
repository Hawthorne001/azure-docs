<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" font-family="'Segoe UI', Arial, sans-serif" role="img" viewBox="0 0 920 380"><title id="title">Chat architecture on Azure Web PubSub</title><desc id="desc">Client apps connect over WebSocket to Azure Web PubSub. The Chat layer runs on top of Web PubSub group broadcasting and reads and writes chat data to your own Azure Storage using a managed identity.</desc><defs><marker id="arrowEnd" markerHeight="8" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#605E5C" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="arrowStart" markerHeight="8" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="0" refY="3"><path fill="#605E5C" d="M8,0 L0,3 L8,6 Z"/></marker></defs><rect width="920" height="380" x="0" y="0" fill="#FFF"/><rect width="170" height="72" x="40" y="95" fill="#FFF" stroke="#8A8886" stroke-width="1.5" rx="10"/><text x="125" y="126" fill="#242424" font-size="15" font-weight="600" text-anchor="middle">Client app</text><text x="125" y="148" fill="#605E5C" font-size="12" text-anchor="middle">(Chat client SDK)</text><rect width="170" height="72" x="40" y="235" fill="#FFF" stroke="#8A8886" stroke-width="1.5" rx="10"/><text x="125" y="266" fill="#242424" font-size="15" font-weight="600" text-anchor="middle">Client app</text><text x="125" y="288" fill="#605E5C" font-size="12" text-anchor="middle">(Chat client SDK)</text><rect width="330" height="300" x="320" y="40" fill="#F0F6FC" stroke="#0078D4" stroke-width="2" rx="14"/><text x="485" y="72" fill="#0B5394" font-size="16" font-weight="700" text-anchor="middle">Azure Web PubSub</text><rect width="280" height="86" x="345" y="100" fill="#CCE4F7" stroke="#0078D4" stroke-width="1.5" rx="8"/><text x="485" y="133" fill="#0B3D66" font-size="15" font-weight="700" text-anchor="middle">Chat</text><text x="485" y="158" fill="#333" font-size="12" text-anchor="middle">Rooms · Messages · History</text><text x="485" y="174" fill="#333" font-size="12" text-anchor="middle">Users · Roles</text><line x1="485" x2="485" y1="188" y2="208" stroke="#605E5C" stroke-width="1.5" marker-end="url(#arrowEnd)"/><rect width="280" height="86" x="345" y="210" fill="#E8F1FA" stroke="#5B9BD5" stroke-width="1.5" rx="8"/><text x="485" y="243" fill="#1F4E79" font-size="15" font-weight="700" text-anchor="middle">Web PubSub</text><text x="485" y="268" fill="#333" font-size="12" text-anchor="middle">WebSocket connections</text><text x="485" y="284" fill="#333" font-size="12" text-anchor="middle">Real-time group broadcast</text><rect width="150" height="150" x="740" y="120" fill="#FFF4CE" stroke="#C19C00" stroke-width="2" rx="12"/><text x="815" y="170" fill="#7A5C00" font-size="14" font-weight="700" text-anchor="middle">Your Azure</text><text x="815" y="189" fill="#7A5C00" font-size="14" font-weight="700" text-anchor="middle">Storage (Table)</text><text x="815" y="218" fill="#605E5C" font-size="11" text-anchor="middle">rooms · members</text><text x="815" y="233" fill="#605E5C" font-size="11" text-anchor="middle">messages · users</text><text x="815" y="248" fill="#605E5C" font-size="11" text-anchor="middle">roles</text><line x1="210" x2="320" y1="131" y2="143" stroke="#605E5C" stroke-width="1.5" marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/><line x1="210" x2="320" y1="271" y2="253" stroke="#605E5C" stroke-width="1.5" marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/><text x="258" y="118" fill="#605E5C" font-size="12" text-anchor="middle">WebSocket</text><line x1="650" x2="740" y1="190" y2="195" stroke="#605E5C" stroke-width="1.5" marker-end="url(#arrowEnd)" marker-start="url(#arrowStart)"/><text x="695" y="176" fill="#605E5C" font-size="11" text-anchor="middle">Read/write</text><text x="695" y="219" fill="#605E5C" font-size="11" text-anchor="middle">via managed identity</text></svg>