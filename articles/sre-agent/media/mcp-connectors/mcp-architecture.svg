<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif" viewBox="0 0 900 520"><rect width="900" height="520" fill="#fafafa" rx="12"/><text x="450" y="32" fill="#1a1a1a" font-size="16" font-weight="600" text-anchor="middle">MCP Connector Architecture</text><rect width="220" height="60" x="340" y="55" fill="#0078d4" stroke="#0078d4" stroke-width="1.5" opacity=".1" rx="8"/><text x="450" y="82" fill="#0078d4" font-size="13" font-weight="600" text-anchor="middle">Azure SRE Agent</text><text x="450" y="100" fill="#555" font-size="10" text-anchor="middle">Auto-discovery · Health monitoring · Tool routing</text><line x1="390" x2="200" y1="115" y2="170" stroke="#0078d4" stroke-dasharray="6 3" stroke-width="1.5"/><text x="270" y="140" fill="#0078d4" font-size="10" font-weight="500">Streamable-HTTP</text><rect width="340" height="160" x="30" y="170" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="8"/><text x="200" y="192" fill="#333" font-size="12" font-weight="600" text-anchor="middle">Remote MCP Servers</text><rect width="95" height="40" x="45" y="205" fill="#632ca6" stroke="#632ca6" stroke-width="1" opacity=".08" rx="4"/><text x="92" y="222" fill="#632ca6" font-size="10" font-weight="500" text-anchor="middle">GitHub</text><text x="92" y="236" fill="#888" font-size="8" text-anchor="middle">PAT (Bearer)</text><rect width="95" height="40" x="150" y="205" fill="#632ca6" stroke="#632ca6" stroke-width="1" opacity=".08" rx="4"/><text x="197" y="222" fill="#632ca6" font-size="10" font-weight="500" text-anchor="middle">Datadog</text><text x="197" y="236" fill="#888" font-size="8" text-anchor="middle">Custom Headers</text><rect width="95" height="40" x="255" y="205" fill="#632ca6" stroke="#632ca6" stroke-width="1" opacity=".08" rx="4"/><text x="302" y="222" fill="#632ca6" font-size="10" font-weight="500" text-anchor="middle">Splunk</text><text x="302" y="236" fill="#888" font-size="8" text-anchor="middle">Bearer Token</text><rect width="95" height="40" x="45" y="255" fill="#632ca6" stroke="#632ca6" stroke-width="1" opacity=".08" rx="4"/><text x="92" y="272" fill="#632ca6" font-size="10" font-weight="500" text-anchor="middle">New Relic</text><text x="92" y="286" fill="#888" font-size="8" text-anchor="middle">Custom Headers</text><rect width="95" height="40" x="150" y="255" fill="#632ca6" stroke="#632ca6" stroke-width="1" opacity=".08" rx="4"/><text x="197" y="272" fill="#632ca6" font-size="10" font-weight="500" text-anchor="middle">Dynatrace</text><text x="197" y="286" fill="#888" font-size="8" text-anchor="middle">Bearer Token</text><rect width="95" height="40" x="255" y="255" fill="#e8e8e8" stroke="#999" stroke-dasharray="4 2" stroke-width="1" rx="4"/><text x="302" y="272" fill="#555" font-size="10" font-weight="500" text-anchor="middle">Custom</text><text x="302" y="286" fill="#888" font-size="8" text-anchor="middle">Any URL + Auth</text><text x="200" y="320" fill="#666" font-size="9" font-style="italic" text-anchor="middle">Pre-configured URL &amp; auth · Just enter credentials</text><line x1="510" x2="700" y1="115" y2="170" stroke="#107c10" stroke-dasharray="6 3" stroke-width="1.5"/><text x="630" y="140" fill="#107c10" font-size="10" font-weight="500">Stdio (local process)</text><rect width="340" height="160" x="530" y="170" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="8"/><text x="700" y="192" fill="#333" font-size="12" font-weight="600" text-anchor="middle">Local MCP Servers</text><rect width="145" height="50" x="545" y="205" fill="#107c10" stroke="#107c10" stroke-width="1" opacity=".08" rx="4"/><text x="617" y="222" fill="#107c10" font-size="10" font-weight="500" text-anchor="middle">Azure MCP Kusto</text><text x="617" y="236" fill="#888" font-size="8" text-anchor="middle">Managed Identity</text><text x="617" y="248" fill="#aaa" font-size="7" text-anchor="middle">Simplified: Name + MI only</text><rect width="145" height="50" x="705" y="205" fill="#107c10" stroke="#107c10" stroke-width="1" opacity=".08" rx="4"/><text x="777" y="222" fill="#107c10" font-size="10" font-weight="500" text-anchor="middle">EV2 MCP</text><text x="777" y="236" fill="#888" font-size="8" text-anchor="middle">Bundled in container</text><text x="777" y="248" fill="#aaa" font-size="7" text-anchor="middle">15 deployment tools</text><rect width="305" height="40" x="545" y="268" fill="#e8e8e8" stroke="#999" stroke-dasharray="4 2" stroke-width="1" rx="4"/><text x="697" y="285" fill="#555" font-size="10" font-weight="500" text-anchor="middle">Custom Stdio Server</text><text x="697" y="299" fill="#888" font-size="8" text-anchor="middle">npx · python · dotnet — Command + Args + Env</text><text x="700" y="320" fill="#666" font-size="9" font-style="italic" text-anchor="middle">Agent manages process lifecycle · Auto-restart on failure</text><rect width="640" height="55" x="130" y="365" fill="#0078d4" stroke="#0078d4" stroke-width="1" opacity=".05" rx="8"/><text x="450" y="385" fill="#0078d4" font-size="11" font-weight="600" text-anchor="middle">Tool Discovery &amp; Assignment</text><text x="450" y="402" fill="#555" font-size="10" text-anchor="middle">Auto-discover tools → Namespace as connector_toolname → Assign to subagents (individual or wildcard/*)</text><line x1="200" x2="300" y1="330" y2="365" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/><line x1="700" x2="600" y1="330" y2="365" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/><rect width="160" height="45" x="180" y="440" fill="#fff" stroke="#0078d4" stroke-width="1" rx="6"/><text x="260" y="460" fill="#0078d4" font-size="10" font-weight="500" text-anchor="middle">kusto-analyst</text><text x="260" y="475" fill="#888" font-size="8" text-anchor="middle">kusto-mcp/* (7 tools)</text><rect width="160" height="45" x="370" y="440" fill="#fff" stroke="#0078d4" stroke-width="1" rx="6"/><text x="450" y="460" fill="#0078d4" font-size="10" font-weight="500" text-anchor="middle">github-researcher</text><text x="450" y="475" fill="#888" font-size="8" text-anchor="middle">github-mcp/* (43 tools)</text><rect width="160" height="45" x="560" y="440" fill="#fff" stroke="#0078d4" stroke-width="1" rx="6"/><text x="640" y="460" fill="#0078d4" font-size="10" font-weight="500" text-anchor="middle">monitoring-expert</text><text x="640" y="475" fill="#888" font-size="8" text-anchor="middle">datadog/* + splunk/*</text><line x1="350" x2="260" y1="420" y2="440" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow2)"/><line x1="450" x2="450" y1="420" y2="440" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow2)"/><line x1="550" x2="640" y1="420" y2="440" stroke="#0078d4" stroke-width="1" marker-end="url(#arrow2)"/><text x="450" y="505" fill="#999" font-size="9" text-anchor="middle">Invoke with /agent slash command in chat · Health monitored every 60s · Deferred loading for late connections</text><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#666" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrow2" markerHeight="6" markerWidth="6" orient="auto" refX="10" refY="5" viewBox="0 0 10 10"><path fill="#0078d4" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs></svg>